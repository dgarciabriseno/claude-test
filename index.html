<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hi Corina!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', cursive, sans-serif;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        /* Speech Bubble */
        .speech-bubble {
            position: relative;
            background: #fff;
            border-radius: 20px;
            padding: 25px 35px;
            font-size: 24px;
            color: #333;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            animation: float 3s ease-in-out infinite, fadeIn 1s ease-out;
            text-align: center;
            max-width: 350px;
        }

        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            border: 15px solid transparent;
            border-top-color: #fff;
        }

        .speech-bubble .greeting {
            font-weight: bold;
            color: #764ba2;
            font-size: 28px;
        }

        .speech-bubble .signature {
            font-size: 16px;
            color: #888;
            margin-top: 10px;
        }

        /* Stickman Container */
        .stickman-container {
            position: relative;
            width: 200px;
            height: 300px;
            margin-top: 20px;
        }

        /* Stickman SVG */
        .stickman {
            width: 100%;
            height: 100%;
        }

        /* Head */
        .head {
            fill: none;
            stroke: #fff;
            stroke-width: 4;
        }

        /* Body parts */
        .body-part {
            fill: none;
            stroke: #fff;
            stroke-width: 4;
            stroke-linecap: round;
        }

        /* Waving arm animation */
        .waving-arm {
            transform-origin: 100px 100px;
            animation: wave 0.6s ease-in-out infinite;
        }

        /* Eyes */
        .eye {
            fill: #fff;
        }

        /* Smile */
        .smile {
            fill: none;
            stroke: #fff;
            stroke-width: 3;
            stroke-linecap: round;
        }

        /* Animations */
        @keyframes wave {
            0%, 100% {
                transform: rotate(-20deg);
            }
            50% {
                transform: rotate(20deg);
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Body bounce animation */
        .stickman-container {
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-5px);
            }
        }

        /* Hand */
        .hand {
            fill: #fff;
        }

        /* Sparkles */
        .sparkle {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #fff;
            border-radius: 50%;
            animation: sparkle 1.5s ease-in-out infinite;
        }

        .sparkle:nth-child(1) {
            top: 10%;
            left: 10%;
            animation-delay: 0s;
        }

        .sparkle:nth-child(2) {
            top: 20%;
            right: 15%;
            animation-delay: 0.3s;
        }

        .sparkle:nth-child(3) {
            bottom: 30%;
            left: 5%;
            animation-delay: 0.6s;
        }

        .sparkle:nth-child(4) {
            bottom: 20%;
            right: 10%;
            animation-delay: 0.9s;
        }

        @keyframes sparkle {
            0%, 100% {
                opacity: 0;
                transform: scale(0);
            }
            50% {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Hearts floating */
        .heart {
            position: absolute;
            font-size: 20px;
            animation: floatUp 3s ease-in-out infinite;
        }

        .heart:nth-child(5) {
            left: 20%;
            animation-delay: 0s;
        }

        .heart:nth-child(6) {
            right: 25%;
            animation-delay: 1s;
        }

        .heart:nth-child(7) {
            left: 40%;
            animation-delay: 2s;
        }

        @keyframes floatUp {
            0% {
                opacity: 0;
                transform: translateY(100px) scale(0.5);
            }
            50% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform: translateY(-100px) scale(1);
            }
        }
    </style>
</head>
<body>
    <!-- Decorative elements -->
    <div class="sparkle"></div>
    <div class="sparkle"></div>
    <div class="sparkle"></div>
    <div class="sparkle"></div>
    <div class="heart">💜</div>
    <div class="heart">💜</div>
    <div class="heart">💜</div>

    <div class="container">
        <!-- Speech Bubble -->
        <div class="speech-bubble">
            <div class="greeting">Hi Corina!</div>
            <div class="signature">Claude made this for you 💜</div>
        </div>

        <!-- Stickman -->
        <div class="stickman-container">
            <svg class="stickman" viewBox="0 0 200 300">
                <!-- Head -->
                <circle class="head" cx="100" cy="50" r="30"/>

                <!-- Eyes -->
                <circle class="eye" cx="90" cy="45" r="4"/>
                <circle class="eye" cx="110" cy="45" r="4"/>

                <!-- Smile -->
                <path class="smile" d="M 85 60 Q 100 75 115 60"/>

                <!-- Body -->
                <line class="body-part" x1="100" y1="80" x2="100" y2="170"/>

                <!-- Left arm (waving) -->
                <g class="waving-arm">
                    <line class="body-part" x1="100" y1="100" x2="60" y2="70"/>
                    <!-- Hand -->
                    <circle class="hand" cx="55" cy="65" r="8"/>
                </g>

                <!-- Right arm -->
                <line class="body-part" x1="100" y1="100" x2="150" y2="140"/>

                <!-- Left leg -->
                <line class="body-part" x1="100" y1="170" x2="70" y2="250"/>

                <!-- Right leg -->
                <line class="body-part" x1="100" y1="170" x2="130" y2="250"/>

                <!-- Feet -->
                <ellipse class="hand" cx="70" cy="255" rx="10" ry="5"/>
                <ellipse class="hand" cx="130" cy="255" rx="10" ry="5"/>
            </svg>
        </div>
    </div>
</body>
</html>
